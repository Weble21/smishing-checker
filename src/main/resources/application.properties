spring.application.name=smishing-checker
spring.config.import=optional:file:.env[.properties]
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
logging.level.org.springframework.web.client=INFO

#파일 크기 제한 설정
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

huggingface.token=${HF_TOKEN:}
huggingface.api-url=https://router.huggingface.co/v1/chat/completions
huggingface.model=google/gemma-3-4b-it:deepinfra

ocr.api-url=${OCR_API_URL:http://127.0.0.1:8001/ocr}
ocr.minimum-confidence=${OCR_MIN_CONFIDENCE:0.55}
