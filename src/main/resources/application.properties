spring.application.name=smishing-checker
spring.config.import=optional:file:.env[.properties]
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
logging.level.org.springframework.web.client=INFO

# 파일 크기 제한 설정
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

ai.base-url=${AI_BASE_URL:http://127.0.0.1:8000}
ai.connect-timeout=${AI_CONNECT_TIMEOUT:3s}
ai.read-timeout=${AI_READ_TIMEOUT:60s}
