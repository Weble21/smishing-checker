spring.application.name=smishing-checker
spring.config.import=optional:file:.env[.properties]
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
logging.level.org.springframework.web.client=INFO

# 파일 크기 제한 설정
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

ai.base-url=${AI_BASE_URL:http://127.0.0.1:8000}
ai.connect-timeout=${AI_CONNECT_TIMEOUT:3s}
ai.read-timeout=${AI_READ_TIMEOUT:60s}

# 이전 비전 분석 클라이언트 설정(현재 기본 분석 흐름에서는 사용하지 않음)
huggingface.token=${HF_TOKEN:}
huggingface.api-url=https://router.huggingface.co/v1/chat/completions
huggingface.model=google/gemma-3-4b-it:deepinfra

# 이전 개별 OCR 클라이언트 설정(/ocr 호환 엔드포인트용)
ocr.api-url=${OCR_API_URL:http://127.0.0.1:8001/ocr}
ocr.minimum-confidence=${OCR_MIN_CONFIDENCE:0.55}
