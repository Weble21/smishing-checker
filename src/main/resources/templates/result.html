<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="업로드한 문자 화면의 스미싱 분석 결과를 확인하세요.">
    <title>안심문자 | 검사 결과</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <link rel="stylesheet" th:href="@{/css/result.css}" href="/css/result.css">
</head>
<body>
    <main class="app-shell result-shell">
        <header class="brand" aria-label="안심문자">
            <span class="brand__mark" aria-hidden="true">
                <svg viewBox="0 0 32 36"><path d="M16 1 29 6v10c0 8.5-5.4 15.3-13 19C8.4 31.3 3 24.5 3 16V6l13-5Z"/><path class="brand__check" d="m10 17 4 4 8-9"/></svg>
            </span>
            <span>안심문자</span>
        </header>

        <header class="result-header">
            <h1>검사 결과</h1>
        </header>

        <section class="risk-card" id="riskCard" aria-labelledby="riskTitle">
            <div class="risk-card__heading">
                <span class="risk-card__icon" id="riskIcon" aria-hidden="true"></span>
                <h2 id="riskTitle"></h2>
            </div>
            <p id="resultSummary"></p>
            <p class="mock-notice" id="mockNotice" hidden>현재 테스트용 분석 결과입니다.</p>
        </section>

        <section class="result-section" aria-labelledby="reasonTitle">
            <h2 id="reasonTitle">왜 이렇게 판단했나요?</h2>
            <ul class="result-list" id="reasonList"></ul>
            <p class="empty-list" id="reasonEmpty" hidden>확인된 판단 이유가 없습니다.</p>
        </section>

        <section class="action-card" aria-labelledby="actionTitle">
            <h2 id="actionTitle">지금 이렇게 하세요</h2>
            <ul class="result-list action-list" id="actionList"></ul>
            <p class="empty-list" id="actionEmpty" hidden>안내된 행동 요령이 없습니다.</p>
            <a class="call-button" href="tel:118">☎ 국번 없이 118 문의</a>
        </section>

        <button class="secondary-button" id="retryButton" type="button">다른 사진 검사하기</button>
        <p class="result-disclaimer">AI 분석 결과만으로 안전 여부를 확정할 수 없어요.<br>의심되면 118 또는 경찰 112에 문의하세요.</p>
    </main>
    <script th:src="@{/js/result.js}" src="/js/result.js" defer></script>
</body>
</html>
