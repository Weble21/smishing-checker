name: CI and Deploy to AWS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  WEB_REPOSITORY: smishing-checker-web
  FASTAPI_REPOSITORY: smishing-checker-fastapi

jobs:
  test:
    name: Test API and web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ocr-service/requirements-test.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate source and deployment scripts
        run: |
          python -m compileall -q ocr-service/app.py ocr-service/smishing_api ocr-service/tests docker/start-api.py scripts/deploy_ssm.py
          bash -n scripts/deploy-ec2.sh
          IMAGE_TAG="$GITHUB_SHA" docker compose --env-file /dev/null -f compose.prod.yml config --quiet
      - name: Test FastAPI and deployment orchestration
        run: |
          python -m pip install -r ocr-service/requirements-test.txt
          python -m pytest ocr-service/tests scripts/tests -q
      - name: Test Spring
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test

  deploy:
    name: Build and deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect OIDC claims
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from scripts.deploy_ssm import deployment_instance_id

          deployment_instance_id()

          role = os.environ.get("ROLE_ARN", "")
          if not re.fullmatch(r"arn:aws:iam::\d{12}:role/[A-Za-z0-9_+=,.@/-]+", role):
              raise SystemExit("AWS_ROLE_ARN must be a complete IAM role ARN with no surrounding whitespace")
          endpoint = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          parts = urllib.parse.urlsplit(endpoint)
          query = urllib.parse.parse_qsl(parts.query, keep_blank_values=True)
          query = [(key, value) for key, value in query if key != "audience"]
          query.append(("audience", "sts.amazonaws.com"))
          endpoint = urllib.parse.urlunsplit(parts._replace(query=urllib.parse.urlencode(query)))
          request = urllib.request.Request(endpoint, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          # Inspection only, not JWT verification. Never print the token or request headers.
          for key in ("iss", "aud", "sub"):
              print(f"OIDC {key}: {claims.get(key)}")
          PY
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -f docker/web.Dockerfile -t "$REGISTRY/$WEB_REPOSITORY:$TAG" .
          docker build -f docker/fastapi.Dockerfile -t "$REGISTRY/$FASTAPI_REPOSITORY:$TAG" .
      - name: Push images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker push "$REGISTRY/$WEB_REPOSITORY:$TAG"
          docker push "$REGISTRY/$FASTAPI_REPOSITORY:$TAG"
      - name: Deploy and verify EC2 using SSM
        timeout-minutes: 42
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: python scripts/deploy_ssm.py
